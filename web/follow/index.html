<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi en direct</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column}
    header{background:#16213e;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.3);z-index:1000}
    header h1{font-size:1.1rem;font-weight:600;color:#e0e0e0}
    header .badge{display:inline-flex;align-items:center;gap:6px;background:#0f3460;padding:4px 10px;border-radius:12px;font-size:0.8rem}
    header .badge .dot{width:8px;height:8px;border-radius:50%;background:#e94560;animation:pulse 2s infinite}
    header .badge.live .dot{background:#4ecca3}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
    #map{flex:1;min-height:0}
    .info-bar{background:#16213e;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:0.85rem;color:#a0a0a0}
    .info-bar .coords{font-family:"SF Mono","Fira Code",monospace;color:#4ecca3}
    .info-bar .time{color:#e94560}
    #loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:2000}
    #loading .spinner{width:40px;height:40px;border:3px solid #0f3460;border-top-color:#4ecca3;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
    @keyframes spin{to{transform:rotate(360deg)}}
    #error{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:2000;background:#16213e;padding:32px;border-radius:12px;max-width:90%}
    #error h2{color:#e94560;margin-bottom:8px}
    #error p{color:#a0a0a0}
    @media(max-width:480px){header{padding:8px 12px}header h1{font-size:0.95rem}.info-bar{padding:8px 12px;font-size:0.75rem}}
  </style>
</head>
<body>
  <header>
    <h1>Suivi en direct</h1>
    <span id="statusBadge" class="badge"><span class="dot"></span><span id="statusText">Connexion...</span></span>
  </header>
  <div id="map"></div>
  <div class="info-bar">
    <span id="coordsDisplay" class="coords">--</span>
    <span id="timeDisplay" class="time">--</span>
  </div>
  <div id="loading"><div class="spinner"></div><p>Connexion au suivi...</p></div>
  <div id="error"><h2>Lien invalide</h2><p>Ce lien de suivi n existe pas ou a expire.</p></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    var FIREBASE_CONFIG={apiKey:"__FIREBASE_API_KEY__",projectId:"__FIREBASE_PROJECT_ID__",appId:"__FIREBASE_APP_ID__"};
    var DEFAULT_CENTER=[42.15,9.10],DEFAULT_ZOOM=10,POSITION_ZOOM=15;
    function getShareCode(){var s=window.location.pathname.split("/").filter(Boolean);var i=s.indexOf("follow");return(i>=0&&s.length>i+1)?s[i+1].toUpperCase():null}
    var shareCode=getShareCode();
    var map=L.map("map",{zoomControl:true,attributionControl:true}).setView(DEFAULT_CENTER,DEFAULT_ZOOM);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"&copy; OpenStreetMap"}).addTo(map);
    var trekkerIcon=L.divIcon({className:"trekker-marker",html:"<div style="width:20px;height:20px;background:#4ecca3;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.4)"></div>",iconSize:[20,20],iconAnchor:[10,10]});
    var marker=null,isFirstPosition=true;
    function updateMarker(lat,lng,ts){if(!marker){marker=L.marker([lat,lng],{icon:trekkerIcon}).addTo(map)}else{marker.setLatLng([lat,lng])}if(isFirstPosition){map.setView([lat,lng],POSITION_ZOOM);isFirstPosition=false}document.getElementById("coordsDisplay").textContent=lat.toFixed(5)+", "+lng.toFixed(5);if(ts){var d=ts instanceof Date?ts:ts.toDate();document.getElementById("timeDisplay").textContent=d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}document.getElementById("statusBadge").classList.add("live");document.getElementById("statusText").textContent="En direct"}
    function startListening(code){var db=firebase.firestore();db.collection("follow_sessions").where("shareCode","==",code).where("isActive","==",true).limit(1).get().then(function(snap){if(snap.empty){showError();return}var sid=snap.docs[0].id;document.getElementById("loading").style.display="none";db.collection("follow_sessions").doc(sid).collection("positions").orderBy("timestamp","desc").limit(1).onSnapshot(function(ps){if(!ps.empty){var p=ps.docs[0].data();updateMarker(p.lat,p.lng,p.timestamp)}},function(e){console.error("[FollowWeb] Erreur:",e)})}).catch(function(e){console.error("[FollowWeb] Erreur:",e);showError()})}
    function showError(){document.getElementById("loading").style.display="none";document.getElementById("error").style.display="block"}
    if(!shareCode){showError()}else{firebase.initializeApp(FIREBASE_CONFIG);startListening(shareCode)}
  </script>
</body>
</html>
