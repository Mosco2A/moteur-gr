name: moteur_gr
description: Moteur generique Flutter multi-sentiers
version: 0.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State Management ---
  flutter_riverpod: ^3.0.0

  # --- Navigation ---
  go_router: ^13.0.0

  # --- Cartes & GPS ---
  flutter_map: ^8.2.0
  flutter_map_mbtiles: ^1.0.4
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  gpx: ^2.2.0

  # --- Stockage local (Drift) ---
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # --- Reseau ---
  connectivity_plus: ^5.0.0
  http: ^1.2.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

  # --- UI ---
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0

  # --- Firebase ---
  firebase_core: ^3.8.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.1.0

  # --- Background & Batterie ---
  flutter_local_notifications: ^18.0.0
  battery_plus: ^6.0.0

  # --- Utilitaires ---
  # --- i18n (Slang) ---
  slang: ^3.31.0
  slang_flutter: ^3.31.0
  logger: ^2.0.0
  intl: ^0.20.2
  uuid: ^4.2.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  permission_handler: ^11.0.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  drift_dev: ^2.22.1
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  flutter_lints: ^3.0.0
  slang_build_runner: ^3.31.0

flutter:
  uses-material-design: true
  assets:
    - assets/gpx/
    - assets/data/
    - assets/i18n/
