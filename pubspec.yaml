name: moteur_gr
description: Moteur generique Flutter multi-sentiers
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State Management ---
  flutter_riverpod: ^2.6.0

  # --- Navigation ---
  go_router: ^13.0.0

  # --- Cartes & GPS ---
  flutter_map: ^8.2.0
  flutter_map_mbtiles: ^1.0.4
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  gpx: ^2.2.0

  # --- Stockage local (Drift) ---
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # --- Reseau ---
  connectivity_plus: ^5.0.0
  http: ^1.2.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

  # --- Home Screen Widget (E5.19a) ---
  home_widget: ^0.6.0

  # --- UI ---
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0

  # --- Firebase ---
  firebase_core: ^3.8.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.1.0

  # --- Background & Batterie ---
  flutter_local_notifications: ^18.0.0
  battery_plus: ^6.0.0
  timezone: ^0.10.0

  # --- Utilitaires ---
  # --- i18n (Slang) ---
  slang: ^4.15.0
  slang_flutter: ^4.15.0
  logger: ^2.0.0
  intl: ^0.20.2
  uuid: ^4.2.0
  crypto: ^3.0.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  permission_handler: ^11.0.0
  package_info_plus: ^8.0.0
  share_plus: ^10.1.4
  url_launcher: ^6.2.0

  # --- PDF ---
  pdf: ^3.11.2
  printing: ^5.13.4

  # --- In-App Review (E5.17) ---
  in_app_review: ^2.0.12

  # --- Ads AdMob (E4.13) — IDs de test sandbox uniquement ---
  google_mobile_ads: ^5.3.0

  # --- In-App Purchase (E4.14/E4.17) — stubs/sandbox, aucun paiement reel ---
  in_app_purchase: ^3.2.0
  firebase_analytics: ^11.6.0
  firebase_crashlytics: ^4.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  melos: ^6.3.2
  # Platform interfaces pour les fakes de tests (notifications, path_provider)
  plugin_platform_interface: ^2.1.8
  flutter_local_notifications_platform_interface: ^8.0.0
  path_provider_platform_interface: ^2.1.2
  build_runner: ^2.4.0
  drift_dev: ^2.22.1
  freezed: ^3.2.5
  json_serializable: ^6.7.0
  flutter_lints: ^3.0.0
  slang_build_runner: ^4.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/gpx/
    - assets/data/
    - assets/data/mare_a_mare_centre/
    - assets/i18n/
    - assets/tips/
