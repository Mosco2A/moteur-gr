name: moteur_gr
description: Moteur generique Flutter multi-sentiers
# Tache 629 : +3 -> +4. Le bundle en version code 3 a ete presente a la Play
# Console et refuse (cible API 35 au lieu de 36). Google refuse de reprendre un
# numero de version deja utilise, y compris apres un depot echoue : « the version
# code must increase with every submission attempt, even if a previous release
# was rejected ». Le nom de version 0.1.2 reste bon pour un test interne, c est
# le numero de build qui doit monter a chaque tentative.
#
# Tache 627 : +4 -> +5. MEME REGLE, APPLIQUEE A UN NUMERO DEJA CONSOMME. Le +4
# n a pas ete refuse : il est DEPOSE. Mesure et non supposee, la chaine des
# numeros deja presentes a Google est : +3 au commit 4146356 (refuse pour cible
# API 35), +4 au commit 285664d du lot 629 (le bundle que Christophe depose
# pendant que j ecris). Un bundle qui reprendrait 4 serait rejete pour numero
# deja utilise, exactement comme 3 l aurait ete. Ce bundle-ci porte donc 5.
# Le nom 0.1.2 ne bouge pas : c est toujours la meme version fonctionnelle,
# augmentee des quatre lots reunis par le 627.
#
# TACHE 631 — 5 EST PRIS, CE BUNDLE PORTE 6. Le 5 est celui que Christophe a
# devant lui depuis 11:17. Google refuse de reprendre un numero deja vu, MEME
# APRES UN DEPOT ECHOUE : le numero monte a chaque tentative, pas a chaque
# succes. Celui-ci porte en plus le compte de test (`STEPWAYS_COMPTE_DE_TEST`),
# qui est ETEINT dans le depot et ne s allume qu au build.
#
# TACHE 633 — 0.1.3+7, ET LE NOM BOUGE POUR LA PREMIERE FOIS DEPUIS LE 627.
# Le numero de build monte a 7 parce que 6 est pris : c est le bundle que
# Christophe a installe depuis le Play Store, celui qu il a juge « une version
# de merde » — il ne portait QUE le lot 631. 3, 4 et 6 sont donc consommes.
# Le NOM passe a 0.1.3 et non plus 0.1.2 : ce bundle-ci n est pas le meme
# perimetre fonctionnel, il reunit pour la premiere fois les trois lots que
# Christophe attendait ensemble — la descente des droits (631), la fiche
# d urgence et d identite a 13 champs (630), et l identite visuelle : logo,
# splash, icone de lancement et les 380 icones (632).
version: 0.1.4+8

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State Management ---
  # Riverpod 3.x (migration INC-1) : bump de version + conservation des API
  # legacy (StateProvider/StateNotifierProvider) via import legacy.dart. Aucun
  # provider migre a ce stade. Retry auto neutralise au ProviderScope racine.
  flutter_riverpod: ^3.3.2

  # --- Navigation ---
  go_router: ^13.0.0

  # --- Cartes & GPS ---
  flutter_map: ^8.2.0
  flutter_map_mbtiles: ^1.0.4
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  gpx: ^2.2.0
  # Import GPX (parite GR20) : selecteur de fichier natif pour choisir une trace
  # .gpx enregistree par une autre app (Strava, Garmin...). Absent jusqu'ici cote
  # StepWays (l'ecran d'import GR20 etait orphelin) — ajoute pour cabler l'import.
  file_picker: ^8.1.6

  # PHOTOS DU JOURNAL (R10, LOT L10) — appareil photo + galerie. Parite GR20
  # (`image_picker: ^1.0.0`) : sans ce plugin, une entree de journal ne peut
  # porter que du texte et la galerie du Diplome (qui filtre les entrees
  # possedant une photo) reste structurellement vide.
  image_picker: ^1.0.0

  # --- Capteurs (Phase 6) ---
  sensors_plus: ^6.0.0
  pedometer: ^4.0.0

  # --- Frequence cardiaque & sante (Phase 6) ---
  # NOTE F6F-01 : le design specifiait health ^11.0.0 mais health 11 exige
  # intl <0.20.0, incompatible avec intl ^0.20.2 deja en stack. On prend la
  # ligne health 13.x (compatible intl 0.20.x) plutot que de degrader intl
  # (qui casserait toute l'app). Conflit remonte, non force (cf. design C5).
  flutter_blue_plus: ^1.32.0
  health: ^13.0.0

  # --- Stockage local (Drift) ---
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # --- Reseau ---
  connectivity_plus: ^7.3.1
  http: ^1.2.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

  # --- Home Screen Widget (E5.19a) ---
  home_widget: ^0.6.0

  # --- UI ---
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0

  # --- Firebase ---
  firebase_core: ^3.8.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.1.0

  # --- Background & Batterie ---
  flutter_local_notifications: ^18.0.0
  battery_plus: ^7.1.2
  timezone: ^0.10.0
  # Capture GPS de fond fiabilisee (re-portage socle) : heberge un isolate
  # dedie @pragma('vm:entry-point') qui capture la position ecran eteint via un
  # foreground service Android, independamment de l'isolate UI (gele en fond).
  flutter_background_service: ^5.0.5

  # --- Utilitaires ---
  # --- i18n (Slang) ---
  slang: ^4.15.0
  slang_flutter: ^4.15.0
  logger: ^2.0.0
  intl: ^0.20.2
  uuid: ^4.2.0
  crypto: ^3.0.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  permission_handler: ^11.0.0
  package_info_plus: ^8.0.0
  share_plus: ^10.1.4
  url_launcher: ^6.2.0

  # --- PDF ---
  pdf: ^3.11.2
  printing: ^5.13.4

  # --- In-App Review (E5.17) ---
  in_app_review: ^2.0.12

  # --- Ads AdMob (E4.13) — IDs de test sandbox uniquement ---
  google_mobile_ads: ^5.3.0

  # --- In-App Purchase (E4.14/E4.17) — stubs/sandbox, aucun paiement reel ---
  in_app_purchase: ^3.2.0
  firebase_analytics: ^11.6.0
  firebase_crashlytics: ^4.3.10

  # --- Backup zero-knowledge (StepWays L7 B/C) ---
  # flutter_secure_storage : stockage des SECRETS (cle de coffre) dans le
  #   keystore OS (Android Keystore / iOS Keychain) — jamais en clair.
  # cryptography : AES-GCM (chiffrement authentifie du blob) + PBKDF2 (derivation
  #   de cle depuis le code de reconnexion). Chiffrement OBLIGATOIRE de tout
  #   backup ; le serveur ne voit QUE du chiffre (zero-knowledge, directive §3).
  flutter_secure_storage: ^10.3.2
  cryptography: ^2.9.0
  country_picker: ^2.0.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Harnais de tests d'integration joues sur emulateur/appareil (pilotage UI
  # reel : taps, saisies, navigation). N'affecte PAS le code applicatif —
  # dependance de TEST uniquement (tâche 518, tests personas en direct).
  integration_test:
    sdk: flutter
  melos: ^6.3.2
  # Platform interfaces pour les fakes de tests (notifications, path_provider)
  plugin_platform_interface: ^2.1.8
  flutter_local_notifications_platform_interface: ^8.0.0
  path_provider_platform_interface: ^2.1.2
  # INTEGRATION 647 — LECTURE DIRECTE D UN .mbtiles DANS UN TEST (tache 648).
  # `mbtiles` arrivait jusqu ici en transitif, par `flutter_map_mbtiles`. Le test
  # test/outillage/cartes_publiees_648_test.dart l importe DIRECTEMENT pour ouvrir
  # la carte publiee et relire une tuile : s appuyer sur un transitif, c est
  # dependre d un choix que fait un autre paquet, et l analyse le dit
  # (depend_on_referenced_packages). Dependance de TEST uniquement.
  mbtiles: ^0.4.0
  build_runner: ^2.4.0
  drift_dev: ^2.22.1
  freezed: ^3.2.5
  json_serializable: ^6.7.0
  flutter_lints: ^3.0.0
  # --- Identite visuelle (tache 632, logo et splash livres par Christophe) ---
  # Outils de GENERATION uniquement : ils fabriquent les mipmaps Android, le
  # jeu d'icones iOS et les ressources de demarrage natives une fois pour
  # toutes, puis ne sont plus embarques dans l'application. Configuration dans
  # flutter_launcher_icons.yaml / flutter_native_splash.yaml a la racine, tous
  # deux ecrits par `python tool/set_branding.py <famille> <splash>`.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  slang_build_runner: ^4.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/gpx/
    - assets/data/
    - assets/data/mare_a_mare_centre/
    # Sentier de demonstration GRATUIT (tache 601) : ses donnees sont
    # celles du Mare a Mare limitees aux deux premieres etapes, reversees
    # sous SON identifiant. Un dossier a lui, comme tout sentier du catalogue.
    - assets/i18n/
    - assets/tips/
    # IDENTITE VISUELLE (tache 632) — les TROIS familles livrees par Christophe
    # sont embarquees : ce sont des traces SVG (texte deja converti en courbes,
    # aucune police requise), quelques centaines d'octets chacune. Les embarquer
    # toutes rend le changement de famille purement declaratif : `python
    # tool/set_branding.py marches` suffit, sans toucher a ce fichier.
    # Les PNG (assets/branding/png, assets/branding/icons) et les images de
    # demarrage (assets/splash) ne sont PAS embarques : ce sont des sources
    # consommees a la GENERATION par flutter_launcher_icons et
    # flutter_native_splash, qui en font des ressources natives.
    - assets/branding/svg/sentier/
    - assets/branding/svg/marches/
    - assets/branding/svg/courbes/
    # LES 118 ICONES DE CHRISTOPHE (tache 632, zip du 29/09 14:41).
    # Grille 24 px, trait 2 px, `stroke="currentColor"`. Le dossier racine porte
    # les 118 traces monochromes. DEUX familles existent en plus en bicolore :
    # les 20 RUBRIQUES de l'application (rubriques-duo + rubriques-duo-mono) et
    # les 43 icones ICO-001 a ICO-027 (ico-duo). Les dossiers `-clair`, pour les
    # fonds sombres, sont DERIVES par `python tool/set_branding.py` et ne sont
    # jamais edites. Tous sont embarques : basculer entre duo et monochrome est
    # une constante Dart (AppBranding.iconesEnDuo), pas une modification d'ici.
    - assets/icons/
    - assets/icons/rubriques-duo/
    - assets/icons/rubriques-duo-clair/
    - assets/icons/rubriques-duo-mono/
    - assets/icons/ico-duo/
    - assets/icons/ico-duo-clair/
    - assets/icons/mat-duo/
    - assets/icons/mat-duo-clair/

  # --- Polices (OFFLINE-FIRST, parite GR20) ---
  # Montserrat EMBARQUEE comme famille Flutter native (comme GR20), et NON via
  # google_fonts en fetch runtime. Motif : google_fonts recuperait Montserrat par
  # HTTP au boot ; hors reseau (mode avion) le fetch echoue et l'exception casse
  # le demarrage (bloquait Ines, payeuse offline). En embarquant les .ttf ici, la
  # police est resolue localement sans aucun reseau, et le matching de graisse
  # de Flutter retombe proprement sur la graisse la plus proche (ex: w500 -> 600)
  # sans jamais lever. Poids fournis : 400 (Regular), 600 (SemiBold), 700 (Bold),
  # identiques a GR20.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
