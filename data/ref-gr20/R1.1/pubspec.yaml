name: g20_app
description: Application GR20 - Accompagnement randonneurs
version: 1.8.4+104

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Firebase ---
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.6.0
  firebase_crashlytics: ^4.2.0
  firebase_storage: ^12.4.0

  # --- Authentification ---
  google_sign_in: 6.1.6
  sign_in_with_apple: ^7.0.0
  flutter_secure_storage: ^9.0.0

  # --- Cartes & GPS ---
  flutter_map: ^6.1.0
  flutter_map_mbtiles: ^1.0.4
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  geocoding: ^2.1.0
  gpx: ^2.2.0
  flutter_compass: ^0.8.0

  # --- Stockage local ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  sqflite: ^2.3.0
  shared_preferences: ^2.2.0

  # --- UI & Design ---
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  fl_chart: ^0.66.0
  photo_view: ^0.14.0

  # --- Navigation & Routing ---
  go_router: ^13.0.0
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # --- Fonctionnel ---
  url_launcher: ^6.2.0
  share_plus: ^7.2.0
  pdf: ^3.10.0
  printing: ^5.12.0
  # in_app_purchase: ^3.1.0  # Retire avant soumission Play Store — sera reactive quand le backend paiement sera pret (#7025)
  permission_handler: ^11.0.0
  image_picker: ^1.0.0
  file_picker: ^8.0.0
  connectivity_plus: ^5.0.0
  battery_plus: ^5.0.0
  wakelock_plus: ^1.1.0

  # --- Background service ---
  flutter_background_service: ^5.0.0

  # --- Notifications ---
  flutter_local_notifications: ^20.0.0
  timezone: ^0.10.0

  # --- HTTP ---
  http: ^1.2.0

  # --- App Info ---
  package_info_plus: ^8.0.0

  # --- Utilitaires ---
  intl: ^0.20.2
  uuid: ^4.2.0
  crypto: ^3.0.3
  logger: ^2.0.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0
  mockito: ^5.4.0
  mocktail: ^1.0.0
  patrol: ^3.3.0
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

# --- Configuration icone app (flutter_launcher_icons) ---
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21

# --- Configuration splash screen (flutter_native_splash) ---
flutter_native_splash:
  color: "#2D5016"
  image: "assets/icons/splash_logo.png"
  android_12:
    color: "#2D5016"
  ios: true
  android: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/gpx/
    - assets/data/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
